name: Build · Linux Cross

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, codex/runtime-ui-lifecycle-integration]
  workflow_dispatch:

concurrency:
  group: build-linux-cross-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Linux ${{ matrix.third_dir }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(github.event_name == 'pull_request' && '{"include":[{"platform":"linux/aarch64","cc":"aarch64-linux-gnu-gcc","cxx":"aarch64-linux-gnu-g++","apt_pkg":"aarch64-linux-gnu","debian_arch":"arm64","third_dir":"aarch64"}]}' || '{"include":[{"platform":"linux/aarch64","cc":"aarch64-linux-gnu-gcc","cxx":"aarch64-linux-gnu-g++","apt_pkg":"aarch64-linux-gnu","debian_arch":"arm64","third_dir":"aarch64"},{"platform":"linux/armv7l","cc":"arm-linux-gnueabihf-gcc","cxx":"arm-linux-gnueabihf-g++","apt_pkg":"arm-linux-gnueabihf","debian_arch":"armhf","third_dir":"armv7l"},{"platform":"linux/riscv64","cc":"riscv64-linux-gnu-gcc","cxx":"riscv64-linux-gnu-g++","apt_pkg":"riscv64-linux-gnu","debian_arch":"riscv64","third_dir":"riscv64"},{"platform":"linux/ppc64el","cc":"powerpc64le-linux-gnu-gcc","cxx":"powerpc64le-linux-gnu-g++","apt_pkg":"powerpc64le-linux-gnu","debian_arch":"ppc64el","third_dir":"ppc64el"},{"platform":"linux/s390x","cc":"s390x-linux-gnu-gcc","cxx":"s390x-linux-gnu-g++","apt_pkg":"s390x-linux-gnu","debian_arch":"s390x","third_dir":"s390x"},{"platform":"linux/mipsel","cc":"mipsel-linux-gnu-gcc","cxx":"mipsel-linux-gnu-g++","apt_pkg":"mipsel-linux-gnu","debian_arch":"mipsel","third_dir":"mipsel"}]}') }}

    steps:
      - uses: actions/checkout@v4

      - name: Clone third-party environment
        run: git clone --depth 1 https://github.com/liulilittle/openppp2-ubuntu-3rd-environment.git "${{ runner.temp }}/3rd"

      - name: Install cross-compiler
        run: |
          if [[ "${{ matrix.debian_arch }}" != "mipsel" ]]; then
            sudo sed -i '/^Types: deb$/a Architectures: amd64' /etc/apt/sources.list.d/ubuntu.sources
            sudo dpkg --add-architecture ${{ matrix.debian_arch }}
            for suite in noble noble-updates noble-backports noble-security; do
              printf 'deb [arch=%s] https://ports.ubuntu.com/ubuntu-ports %s main universe\n' \
                "${{ matrix.debian_arch }}" "$suite"
            done | sudo tee /etc/apt/sources.list.d/ubuntu-ports.list
          fi
          sudo apt-get update -y
          if [[ "${{ matrix.debian_arch }}" == "mipsel" ]]; then
            sudo apt-get install -y --no-install-recommends \
              build-essential cmake zip unzip \
              gcc-${{ matrix.apt_pkg }} g++-${{ matrix.apt_pkg }}
          else
            sudo apt-get install -y --no-install-recommends \
              build-essential cmake zip unzip \
              gcc-${{ matrix.apt_pkg }} g++-${{ matrix.apt_pkg }} \
              zlib1g-dev:${{ matrix.debian_arch }} libzstd-dev:${{ matrix.debian_arch }}
          fi

      - name: Build libunwind for target
        run: |
          cd /tmp
          wget -q https://github.com/libunwind/libunwind/releases/download/v1.8.1/libunwind-1.8.1.tar.gz
          tar xf libunwind-1.8.1.tar.gz
          cd libunwind-1.8.1
          ./configure --host=${{ matrix.apt_pkg }} --prefix=${{ runner.temp }}/libunwind --disable-shared --enable-static
          make -j$(nproc)
          make install

      - name: Build compression libraries for target
        run: |
          PREFIX="${{ runner.temp }}/cross-compression/${{ matrix.debian_arch }}"
          CC="${{ matrix.cc }}"
          AR="${{ matrix.apt_pkg }}-ar"
          RANLIB="${{ matrix.apt_pkg }}-ranlib"
          mkdir -p "$PREFIX"

          cd /tmp
          curl -fsSLO https://github.com/madler/zlib/releases/download/v1.3.1/zlib-1.3.1.tar.xz
          echo "38ef96b8dfe510d42707d9c781877914792541133e1870841463bfa73f883e32  zlib-1.3.1.tar.xz" | sha256sum --check --status
          tar xf zlib-1.3.1.tar.xz
          cd zlib-1.3.1
          CC="$CC" AR="$AR" RANLIB="$RANLIB" ./configure --static --prefix="$PREFIX"
          make -j"$(nproc)" CC="$CC" AR="$AR" RANLIB="$RANLIB"
          make install

          cd /tmp
          curl -fsSLO https://github.com/facebook/zstd/releases/download/v1.5.5/zstd-1.5.5.tar.gz
          tar xf zstd-1.5.5.tar.gz
          make -C zstd-1.5.5/lib -j"$(nproc)" libzstd.a CC="$CC" AR="$AR" RANLIB="$RANLIB"
          install -d "$PREFIX/lib" "$PREFIX/include"
          install -m 644 zstd-1.5.5/lib/libzstd.a "$PREFIX/lib/"
          install -m 644 zstd-1.5.5/lib/zstd.h zstd-1.5.5/lib/zstd_errors.h "$PREFIX/include/"
          echo "CROSS_COMPRESSION_PREFIX=$PREFIX" >> "$GITHUB_ENV"

      - name: Build openppp2
        run: |
          TP="${{ runner.temp }}/3rd/${{ matrix.third_dir }}"
          TARGET_PROCESSOR="${{ matrix.platform }}"
          TARGET_PROCESSOR="${TARGET_PROCESSOR#linux/}"
          if [ "$TARGET_PROCESSOR" = "ppc64el" ]; then TARGET_PROCESSOR=ppc64le; fi
          LINK_FLAGS="-L${{ runner.temp }}/libunwind/lib -L${CROSS_COMPRESSION_PREFIX}/lib"
          CPP_FLAGS="-DOPENSSL_API_COMPAT=0x10100000L -I${CROSS_COMPRESSION_PREFIX}/include"
          mkdir -p build && cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR="$TARGET_PROCESSOR" \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DCMAKE_EXE_LINKER_FLAGS="$LINK_FLAGS" \
            -DCMAKE_CXX_FLAGS="$CPP_FLAGS" \
            -DTHIRD_PARTY_LIBRARY_DIR="$TP"
          make -j$(nproc)

      - name: Package artifact
        run: |
          PLATFORM_SAFE="${{ matrix.platform }}"
          PLATFORM_SAFE="${PLATFORM_SAFE//\//-}"
          ARTIFACT="openppp2-${PLATFORM_SAFE}-cross.zip"
          echo "ARTIFACT=$ARTIFACT" >> $GITHUB_ENV
          cd bin && zip -r "$ARTIFACT" ppp

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}
          path: bin/${{ env.ARTIFACT }}
          if-no-files-found: error
