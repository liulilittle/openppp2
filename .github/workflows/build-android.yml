name: Build · Android

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, codex/runtime-ui-lifecycle-integration]
  workflow_dispatch:

concurrency:
  group: build-android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Android ${{ matrix.abi }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(github.event_name == 'pull_request' && '{"include":[{"abi":"arm64-v8a","ppp_abi":"aarch64"},{"abi":"x86_64","ppp_abi":"x64"}]}' || '{"include":[{"abi":"arm64-v8a","ppp_abi":"aarch64"},{"abi":"armeabi-v7a","ppp_abi":"armv7a"},{"abi":"x86","ppp_abi":"x86"},{"abi":"x86_64","ppp_abi":"x64"}]}') }}

    steps:
      - uses: actions/checkout@v4

      - name: Cache NDK and dependencies
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ndk
          key: android-ndk-r20b-boost174-openssl111i

      - name: Download NDK
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          mkdir -p "${{ runner.temp }}/ndk" && cd "${{ runner.temp }}/ndk"
          wget -q https://dl.google.com/android/repository/android-ndk-r20b-linux-x86_64.zip
          unzip -q android-ndk-r20b-linux-x86_64.zip && rm android-ndk-r20b-linux-x86_64.zip
          mv android-ndk-r20b abi

      - name: Clone Boost for Android
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          mkdir -p "${{ runner.temp }}/ndk"
          git clone --depth 1 https://github.com/liulilittle/boost-1.74-for-android-r20b-fpic.git "${{ runner.temp }}/ndk/boost"

      - name: Clone OpenSSL for Android
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          mkdir -p "${{ runner.temp }}/ndk"
          git clone --depth 1 https://github.com/liulilittle/openssl-1.1.1i-for-android-r20b.git "${{ runner.temp }}/ndk/openssl"

      - name: Build openppp2
        run: |
          NDK_ROOT="${{ runner.temp }}/ndk/abi"
          TP="${{ runner.temp }}/ndk"
          export PPP_ANDROID_ABI=${{ matrix.ppp_abi }}

          cd android && mkdir -p build && cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="${NDK_ROOT}/build/cmake/android.toolchain.cmake" \
            -DCMAKE_SYSTEM_NAME=Android \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_NATIVE_API_LEVEL=21 \
            -DANDROID_STL=c++_static \
            -DTHIRD_PARTY_LIBRARY_DIR="$TP"
          make -j$(nproc)

      - name: Package artifact
        run: |
          ARTIFACT=openppp2-android-${{ matrix.abi }}.zip
          echo "ARTIFACT=$ARTIFACT" >> $GITHUB_ENV
          cd bin/android/${{ matrix.abi }}
          zip -r "$ARTIFACT" libopenppp2.so
          mv "$ARTIFACT" ../../

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}
          path: bin/${{ env.ARTIFACT }}
          if-no-files-found: error

  device-test:
    # Runs the whole androidTest suite, not just P2P socket protection.
    # It is not gated on the event: skipping pull requests meant an
    # instrumentation regression only surfaced after the merge.
    name: Android P2P socket protection
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Download x86_64 native library
        uses: actions/download-artifact@v4
        with:
          name: openppp2-android-x86_64.zip
          path: so-artifact

      - name: Extract native library
        run: |
          mkdir -p android/android/app/src/main/jniLibs/x86_64
          unzip -o so-artifact/openppp2-android-x86_64.zip \
            -d android/android/app/src/main/jniLibs/x86_64

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          cache: true

      - name: Set up Gradle 8.14
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Resolve Flutter dependencies
        run: cd android && flutter pub get

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Capture emulator runner preflight
        run: |
          mkdir -p device-evidence
          {
            echo "workspace=${GITHUB_WORKSPACE}"
            echo "runner=${RUNNER_OS}/${RUNNER_ARCH}"
            java -version || true
            if command -v adb >/dev/null 2>&1; then
              adb version || true
            else
              echo "adb is not on PATH before emulator startup"
            fi
            ls -l /dev/kvm || true
          } > device-evidence/runner-preflight.txt 2>&1

      - name: Run API 34 instrumentation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: android/android
          script: >-
            mkdir -p "${{ github.workspace }}/device-evidence";
            gradle :app:connectedDebugAndroidTest --no-daemon --console=plain --stacktrace > "${{ github.workspace }}/device-evidence/gradle.txt" 2>&1; status=$?;
            cat "${{ github.workspace }}/device-evidence/gradle.txt";
            adb logcat -d > "${{ github.workspace }}/device-evidence/logcat.txt" 2>&1 || true;
            exit "${status}"

      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-p2p-protect-device-evidence
          path: |
            device-evidence/
            android/android/app/build/outputs/androidTest-results/connected/
            android/android/app/build/reports/androidTests/connected/
          if-no-files-found: warn

  build-apk:
    name: Build Flutter APK
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Download all .so artifacts
        uses: actions/download-artifact@v4
        with:
          path: so-artifacts
          pattern: openppp2-android-*.zip

      - name: Extract .so into jniLibs
        run: |
          for zip in so-artifacts/openppp2-android-*.zip/openppp2-android-*.zip; do
            abi=$(basename "$zip" | sed 's/openppp2-android-//;s/\.zip//')
            mkdir -p "android/android/app/src/main/jniLibs/${abi}"
            unzip -o "$zip" -d "android/android/app/src/main/jniLibs/${abi}"
          done
          echo "=== jniLibs tree ==="
          find android/android/app/src/main/jniLibs -type f

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          cache: true

      - name: Flutter doctor & pub get
        run: |
          flutter doctor -v
          cd android && flutter pub get

      - name: Configure Android release signing
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # A fork does not inherit the signing secrets. Report that and skip
          # the release build rather than failing the Android workflow, which
          # would mask the build and instrumentation results in the same run.
          required=(ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD)
          for name in "${required[@]}"; do
            if [ -z "${!name}" ]; then
              echo "::notice::Release signing secret ${name} is not set; skipping the signed APK."
              echo "signed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          mkdir -p android/android/keystore
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/android/keystore/yav-release-key.p12
          {
            echo "storeFile=keystore/yav-release-key.p12"
            echo "storePassword=${ANDROID_KEYSTORE_PASSWORD}"
            echo "keyAlias=${ANDROID_KEY_ALIAS}"
            echo "keyPassword=${ANDROID_KEY_PASSWORD}"
          } > android/android/keystore/yav-release-key.properties
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        if: steps.signing.outputs.signed == 'true'
        run: |
          cd android
          flutter build apk --release

      - name: Verify signed APK
        if: steps.signing.outputs.signed == 'true'
        run: |
          ${ANDROID_HOME}/build-tools/$(ls ${ANDROID_HOME}/build-tools | sort -V | tail -n 1)/apksigner verify \
            --verbose --print-certs android/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload signed APK
        if: steps.signing.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: openppp2-android-signed-apk
          path: android/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
