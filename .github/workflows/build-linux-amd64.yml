# Description: PPP PRIVATE NETWORK(TM) 2 – Linux amd64 native build with feature matrix.
# Author     : OpenCode.
# Date-Time  : 2026/05/03

name: Build · Linux amd64

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, codex/runtime-ui-lifecycle-integration]
  workflow_dispatch:

concurrency:
  group: build-linux-amd64-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BOOST_VERSION: "1.86.0"
  OPENSSL_VERSION: "3.0.13"
  JEMALLOC_VERSION: "5.3.0"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Linux amd64 ${{ matrix.suffix }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(github.event_name == 'pull_request' && '{"include":[{"suffix":"","enable_sysnat":"OFF","enable_io_uring":"OFF","enable_simd":"OFF"},{"suffix":"-tc-io-uring-simd","enable_sysnat":"ON","enable_io_uring":"ON","enable_simd":"ON"}]}' || '{"include":[{"suffix":"","enable_sysnat":"OFF","enable_io_uring":"OFF","enable_simd":"OFF"},{"suffix":"-io-uring","enable_sysnat":"OFF","enable_io_uring":"ON","enable_simd":"OFF"},{"suffix":"-simd","enable_sysnat":"OFF","enable_io_uring":"OFF","enable_simd":"ON"},{"suffix":"-tc","enable_sysnat":"ON","enable_io_uring":"OFF","enable_simd":"OFF"},{"suffix":"-tc-io-uring","enable_sysnat":"ON","enable_io_uring":"ON","enable_simd":"OFF"},{"suffix":"-tc-simd","enable_sysnat":"ON","enable_io_uring":"OFF","enable_simd":"ON"},{"suffix":"-io-uring-simd","enable_sysnat":"OFF","enable_io_uring":"ON","enable_simd":"ON"},{"suffix":"-tc-io-uring-simd","enable_sysnat":"ON","enable_io_uring":"ON","enable_simd":"ON"}]}') }}

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake git zip unzip curl wget \
            libkrb5-dev libicu-dev libssl-dev libunwind-dev \
            autoconf clang libbenchmark-dev \
            liburing-dev libbpf-dev

      - name: Cache third-party libraries
        id: cache-third
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/third-party
          key: linux-amd64-third-v2-boost${{ env.BOOST_VERSION }}-openssl${{ env.OPENSSL_VERSION }}-jemalloc${{ env.JEMALLOC_VERSION }}

      - name: Build Boost
        if: steps.cache-third.outputs.cache-hit != 'true'
        run: |
          mkdir -p third-party && cd third-party
          wget -q "https://archives.boost.io/release/${BOOST_VERSION}/source/boost_${BOOST_VERSION//./_}.tar.bz2"
          tar jxf boost_*.tar.bz2 && rm boost_*.tar.bz2
          mv boost_* boost
          cd boost && ./bootstrap.sh && ./b2 cxxflags=-fPIC -j$(nproc)

      - name: Build OpenSSL
        if: steps.cache-third.outputs.cache-hit != 'true'
        run: |
          mkdir -p third-party && cd third-party
          wget -q "https://www.openssl.org/source/openssl-${OPENSSL_VERSION}.tar.gz"
          tar zxf openssl-*.tar.gz && rm openssl-*.tar.gz
          mv openssl-* openssl
          cd openssl && ./Configure && make -j$(nproc)

      - name: Build jemalloc
        if: steps.cache-third.outputs.cache-hit != 'true'
        run: |
          mkdir -p third-party && cd third-party
          wget -q "https://github.com/jemalloc/jemalloc/releases/download/${JEMALLOC_VERSION}/jemalloc-${JEMALLOC_VERSION}.tar.bz2"
          tar jxf jemalloc-*.tar.bz2 && rm jemalloc-*.tar.bz2
          mv jemalloc-* jemalloc
          cd jemalloc && ./autogen.sh --with-jemalloc-prefix=je_ && make -j$(nproc)

      - name: Build openppp2
        run: |
          TP="${{ github.workspace }}/third-party"
          mkdir -p build && cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DTHIRD_PARTY_LIBRARY_DIR="$TP" \
            -DENABLE_SYSNAT=${{ matrix.enable_sysnat }} \
            -DENABLE_IO_URING=${{ matrix.enable_io_uring }} \
            -DENABLE_SIMD=${{ matrix.enable_simd }}
          make -j$(nproc)

      - name: UDP benchmark correctness smoke
        if: matrix.suffix == ''
        run: |
          TP="${{ github.workspace }}/third-party"
          cmake -S bench -B build-bench \
            -DCMAKE_BUILD_TYPE=Release \
            -DOPENPPP2_BOOST_INCLUDE_DIR="$TP/boost"
          cmake --build build-bench -j$(nproc)
          ctest --test-dir build-bench --output-on-failure -L correctness

      - name: Client/server Android-key compat smoke
        if: matrix.suffix == ''
        run: |
          sudo PPP_BIN="$PWD/bin/ppp" COMPAT_MODE=match \
            bash tools/client_server_compat_smoke.sh
          sudo PPP_BIN="$PWD/bin/ppp" COMPAT_MODE=mismatch \
            bash tools/client_server_compat_smoke.sh

      - name: Collect artifacts
        run: |
          ARTIFACT="openppp2-linux-amd64${{ matrix.suffix }}.zip"
          ARTIFACT_DIR="artifact"
          mkdir -p "$ARTIFACT_DIR"

          # Copy binary
          cp bin/ppp "$ARTIFACT_DIR/"

          # Copy configuration files
          for f in appsettings.json cacert.pem cacert.sha256 \
                   dns-rules.txt firewall-rules.txt ip.txt \
                   cmcc.txt starrylink.net.key starrylink.net.pem; do
            if [ -f "$f" ]; then cp "$f" "$ARTIFACT_DIR/"; fi
          done

          # Copy documentation
          for f in README.md README_CN.md LICENSE; do
            if [ -f "$f" ]; then cp "$f" "$ARTIFACT_DIR/"; fi
          done

          # Copy Linux driver / sysnat sources for downstream kernel module builds
          mkdir -p "$ARTIFACT_DIR/linux/ppp/tap"
          for f in linux/ppp/tap/TapLinux.cpp linux/ppp/tap/TapLinux.h \
                   linux/ppp/tap/openppp2_driver.skel.h \
                   linux/ppp/tap/openppp2_sysnat.c \
                   linux/ppp/tap/openppp2_sysnat.h; do
            if [ -f "$f" ]; then cp "$f" "$ARTIFACT_DIR/linux/ppp/tap/"; fi
          done

          # Package
          cd "$ARTIFACT_DIR" && zip -r "../$ARTIFACT" .
          cd ..
          mv "$ARTIFACT" bin/

      - uses: actions/upload-artifact@v4
        with:
          name: openppp2-linux-amd64${{ matrix.suffix }}
          path: bin/openppp2-linux-amd64${{ matrix.suffix }}.zip
          if-no-files-found: error

      # XTCP end-to-end runs after packaging: the root CMake always links the
      # ppp executable into bin/, so the XTCP-enabled rebuild below overwrites
      # bin/ppp and must not precede artifact collection.
      - name: XTCP TAP netns end-to-end
        if: matrix.suffix == ''
        run: |
          bash tools/prepare_xtcp.sh
          TP="${{ github.workspace }}/third-party"
          cmake -S . -B build-xtcp \
            -DCMAKE_BUILD_TYPE=Release \
            -DTHIRD_PARTY_LIBRARY_DIR="$TP" \
            -DENABLE_XTCP=ON \
            -DENABLE_SYSNAT=OFF -DENABLE_IO_URING=OFF -DENABLE_SIMD=OFF
          cmake --build build-xtcp -j$(nproc)
          sudo PPP_BIN="$PWD/bin/ppp" \
            OPENPPP2_NAMESPACE_ARTIFACT_DIR="$PWD/xtcp-e2e-artifacts" \
            bash tests/integration/linux/xtcp_tap_netns_e2e.sh

      - name: Upload XTCP E2E artifacts
        if: matrix.suffix == '' && failure()
        uses: actions/upload-artifact@v4
        with:
          name: xtcp-e2e-artifacts
          path: xtcp-e2e-artifacts/
          if-no-files-found: ignore

  # ── Debian 10 (Buster) compatibility build ──────────────────────────
  # Ensures the binary runs on Debian 10 / glibc 2.28 / kernel 4.19+.
  # io_uring and SYSNAT are disabled (require kernel ≥ 5.10).
  build-debian10:
    name: Linux amd64 Debian 10
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    container: debian:buster

    steps:
      - name: Install Git for checkout
        run: |
          # Debian 10 Buster reached EOL; switch to archive mirrors before checkout.
          sed -i 's|deb.debian.org/debian|archive.debian.org/debian|g' /etc/apt/sources.list
          sed -i 's|deb.debian.org/debian-security|archive.debian.org/debian-security|g' /etc/apt/sources.list
          sed -i '/buster-updates/d' /etc/apt/sources.list
          apt-get update -y
          apt-get install -y --no-install-recommends git ca-certificates

      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          apt-get install -y --no-install-recommends \
            build-essential cmake zip unzip curl wget \
            libkrb5-dev libicu-dev libssl-dev libunwind-dev \
            autoconf

      - name: Cache third-party libraries
        id: cache-third
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/third-party
          key: linux-amd64-debian10-third-v2-boost${{ env.BOOST_VERSION }}-openssl${{ env.OPENSSL_VERSION }}-jemalloc${{ env.JEMALLOC_VERSION }}

      - name: Build Boost
        if: steps.cache-third.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p third-party && cd third-party
          wget -q "https://archives.boost.io/release/${BOOST_VERSION}/source/boost_${BOOST_VERSION//./_}.tar.bz2"
          tar jxf boost_*.tar.bz2 && rm boost_*.tar.bz2
          mv boost_* boost
          cd boost && ./bootstrap.sh && ./b2 cxxflags=-fPIC -j$(nproc)

      - name: Build OpenSSL
        if: steps.cache-third.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p third-party && cd third-party
          wget -q "https://www.openssl.org/source/openssl-${OPENSSL_VERSION}.tar.gz"
          tar zxf openssl-*.tar.gz && rm openssl-*.tar.gz
          mv openssl-* openssl
          cd openssl && ./Configure && make -j$(nproc)

      - name: Build jemalloc
        if: steps.cache-third.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p third-party && cd third-party
          wget -q "https://github.com/jemalloc/jemalloc/releases/download/${JEMALLOC_VERSION}/jemalloc-${JEMALLOC_VERSION}.tar.bz2"
          tar jxf jemalloc-*.tar.bz2 && rm jemalloc-*.tar.bz2
          mv jemalloc-* jemalloc
          cd jemalloc && ./autogen.sh --with-jemalloc-prefix=je_ && make -j$(nproc)

      - name: Build openppp2
        shell: bash
        run: |
          # Inside a Debian container $GITHUB_WORKSPACE maps to /__w/...
          # while ${{ github.workspace }} resolves to the host path.
          TP="$GITHUB_WORKSPACE/third-party"
          mkdir -p build && cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DTHIRD_PARTY_LIBRARY_DIR="$TP" \
            -DENABLE_SYSNAT=OFF \
            -DENABLE_IO_URING=OFF
          make -j$(nproc)

      - name: Collect artifacts
        shell: bash
        run: |
          ARTIFACT="openppp2-linux-amd64-debian10.zip"
          ARTIFACT_DIR="artifact"
          mkdir -p "$ARTIFACT_DIR"

          cp bin/ppp "$ARTIFACT_DIR/"

          for f in appsettings.json cacert.pem cacert.sha256 \
                   dns-rules.txt firewall-rules.txt ip.txt \
                   cmcc.txt starrylink.net.key starrylink.net.pem; do
            if [ -f "$f" ]; then cp "$f" "$ARTIFACT_DIR/"; fi
          done

          for f in README.md README_CN.md LICENSE; do
            if [ -f "$f" ]; then cp "$f" "$ARTIFACT_DIR/"; fi
          done

          cd "$ARTIFACT_DIR" && zip -r "../$ARTIFACT" .
          cd ..
          mv "$ARTIFACT" bin/

      - uses: actions/upload-artifact@v4
        with:
          name: openppp2-linux-amd64-debian10
          path: bin/openppp2-linux-amd64-debian10.zip
          if-no-files-found: error

  # ── AddressSanitizer diagnostic build ──────────────────────────────
  # Diagnostic only (NOT for production). Builds with -DENABLE_ASAN=ON which
  # disables jemalloc so ASan's allocator interceptors are in effect, to
  # reproduce/pin down the vmux multi-link teardown heap corruption (issue #5).
  # jemalloc is intentionally NOT built here (the macro is off).
  build-asan:
    name: Linux amd64 ASan
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake git zip unzip curl wget \
            libkrb5-dev libicu-dev libssl-dev libunwind-dev \
            autoconf clang \
            liburing-dev libbpf-dev

      - name: Cache third-party libraries (ASan, no jemalloc)
        id: cache-third-asan
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/third-party
          key: linux-amd64-asan-third-v1-boost${{ env.BOOST_VERSION }}-openssl${{ env.OPENSSL_VERSION }}

      - name: Build Boost
        if: steps.cache-third-asan.outputs.cache-hit != 'true'
        run: |
          mkdir -p third-party && cd third-party
          wget -q "https://archives.boost.io/release/${BOOST_VERSION}/source/boost_${BOOST_VERSION//./_}.tar.bz2"
          tar jxf boost_*.tar.bz2 && rm boost_*.tar.bz2
          mv boost_* boost
          cd boost && ./bootstrap.sh && ./b2 cxxflags=-fPIC -j$(nproc)

      - name: Build OpenSSL
        if: steps.cache-third-asan.outputs.cache-hit != 'true'
        run: |
          mkdir -p third-party && cd third-party
          wget -q "https://www.openssl.org/source/openssl-${OPENSSL_VERSION}.tar.gz"
          tar zxf openssl-*.tar.gz && rm openssl-*.tar.gz
          mv openssl-* openssl
          cd openssl && ./Configure && make -j$(nproc)

      - name: Build openppp2 (ASan)
        run: |
          TP="${{ github.workspace }}/third-party"
          mkdir -p build && cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Debug \
            -DTHIRD_PARTY_LIBRARY_DIR="$TP" \
            -DENABLE_ASAN=ON \
            -DENABLE_UBSAN=ON \
            -DENABLE_VMUX_CHURN_TEST=ON \
            -DENABLE_VMUX_RECEIVE_SEMANTICS_TEST=ON \
            -DENABLE_SYSNAT=OFF \
            -DENABLE_IO_URING=OFF \
            -DENABLE_SIMD=OFF
          make -j$(nproc)

      - name: Run VMUX sanitizer tests
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:strict_string_checks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          bin/vmux_net_churn_integration_test
          bin/vmux_receive_semantics_test

      - name: Collect ASan artifact
        run: |
          ARTIFACT="openppp2-linux-amd64-asan.zip"
          ARTIFACT_DIR="artifact"
          mkdir -p "$ARTIFACT_DIR"
          cp bin/ppp "$ARTIFACT_DIR/"
          for f in appsettings.json README.md LICENSE; do
            if [ -f "$f" ]; then cp "$f" "$ARTIFACT_DIR/"; fi
          done
          cd "$ARTIFACT_DIR" && zip -r "../$ARTIFACT" .
          cd ..
          mv "$ARTIFACT" bin/

      - uses: actions/upload-artifact@v4
        with:
          name: openppp2-linux-amd64-asan
          path: bin/openppp2-linux-amd64-asan.zip
          if-no-files-found: error
